<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAZE // Secure Portal v0.1 Beta</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Unbounded:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    .font-display { font-family: 'Unbounded', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    .font-sans { font-family: 'Inter', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: rgba(3, 3, 5, 0.9); }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes floatSlow { 0%, 100% { transform: translateY(0px) scale(1); } 50% { transform: translateY(-15px) scale(1.05); } }
    .animate-float { animation: floatSlow 8s ease-in-out infinite; }

    @keyframes leaderGlow {
      0%, 100% { box-shadow: 0 0 25px rgba(251, 191, 36, 0.2), inset 0 1px 0 rgba(251, 191, 36, 0.3); border-color: rgba(251, 191, 36, 0.5); }
      50% { box-shadow: 0 0 45px rgba(251, 191, 36, 0.4), inset 0 1px 0 rgba(251, 191, 36, 0.6); border-color: rgba(251, 191, 36, 0.8); }
    }
    .leader-card-glow { animation: leaderGlow 4s infinite ease-in-out; }

    @keyframes devGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(6, 182, 212, 0.2); border-color: rgba(6, 182, 212, 0.4); }
      50% { box-shadow: 0 0 35px rgba(6, 182, 212, 0.4); border-color: rgba(6, 182, 212, 0.7); }
    }
    .dev-card-glow { animation: devGlow 4s infinite ease-in-out; }

    @keyframes collerGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); border-color: rgba(239, 68, 68, 0.4); }
      50% { box-shadow: 0 0 35px rgba(239, 68, 68, 0.4); border-color: rgba(239, 68, 68, 0.7); }
    }
    .coller-card-glow { animation: collerGlow 4s infinite ease-in-out; }

    .glass-card {
      background: rgba(12, 12, 16, 0.75);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.18);
    }
  </style>
</head>
<body class="bg-[#030305] text-zinc-100 font-sans selection:bg-white selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const LEADERSHIP_DATA = {
      Miami: {
        serverTitle: 'MIAMI #8',
        serverNumber: '8',
        leader: { nick: 'Rulf Haze', staticId: '298624', discord: 'anirool', role: 'Leader Miami', badgeText: 'ЛИДЕР СЕМЬИ', badgeType: 'leader' },
        owners: [
          { nick: 'Winston Haze', staticId: '282231', discord: 'k_5504', role: 'Owner Miami', badgeText: 'РАЗРАБОТЧИК САЙТА', badgeType: 'dev', subNote: 'Разработчик сайта и инфраструктуры портала семьи Haze.' },
          { nick: 'Swapper Haze', staticId: '90295', discord: 'kst_swaper', role: 'Owner Miami', badgeText: 'ГЛАВНЫЙ КОЛЛЕР', badgeType: 'coller', subNote: 'Главный коллер семьи. Управление составом на каптах, аирдропах и ВЗМ.' },
          { nick: 'Marcus Haze', staticId: '229798', discord: 'epsik09', role: 'Owner Miami', badgeText: 'HIGH OWNER // MIAMI', badgeType: 'marcus', subNote: 'Высокое руководство и контроль ключевых направлений семьи на Miami.' },
          { nick: 'ed fox', staticId: '232251', discord: '899mods', role: 'Owner Miami', badgeText: 'OWNER // MIAMI', badgeType: 'mono', subNote: 'Управляющий состав семьи, контроль активности на сервере.' },
        ],
      },
      Memphis: {
        serverTitle: 'MEMPHIS #19',
        serverNumber: '19',
        leader: { nick: 'Swapper Haze', staticId: '90295', discord: 'kst_swaper', role: 'Leader Memphis', badgeText: 'ЛИДЕР СЕМЬИ', badgeType: 'leader' },
        owners: [
          { nick: 'Markus Shade', staticId: '123524', discord: 'epsik09', role: 'Owner Memphis', badgeText: 'OWNER // MEMPHIS', badgeType: 'mono', subNote: 'Управляющий состав семьи на сервере Memphis #19.' },
          { nick: 'Georgiy Asford', staticId: '166366', discord: 'vertigo555gsha', role: 'Owner Memphis', badgeText: 'OWNER // MEMPHIS', badgeType: 'mono', subNote: 'Управляющий состав семьи на сервере Memphis #19.' },
        ],
      },
    };

    const getRootPngFilename = (categoryId, locationName) => {
      if (categoryId === 'callouts') return `image/${locationName}-с-обозначениями.jpg`;
      if (categoryId === 'mcl') {
        if (locationName === 'Windmill') return `image/Windmill-mcl.png`;
        if (locationName === 'Redwood') return `image/Redwood-mcl.png`;
        if (locationName === 'Mirror') return `image/Mirror-mcl.png`;
        if (locationName === 'Ghetto') return `image/Ghetto-mcl.png`;
        if (locationName === 'Industrial Area') return `image/Industrial Area-mcl.png`;
        if (locationName === 'Vinewood') return `image/Vinewood-mcl.png`;
        if (locationName === 'Sandy Shores') return `image/Sandy Shores-mcl.png`;
        if (locationName === 'Farm') return `image/Farm-mcl.png`;
        if (locationName === 'City') return `image/City-mcl.png`;
        return `image/${locationName}-mcl.png`;
      }
      if (categoryId === 'airdrop') return `image/${locationName}-airdrop-full.png`;
      if (categoryId === 'dealers') return `image/Цеха_Дилеры-cx-dealers.png`;
      if (categoryId === 'zancudo') return `image/Fort Zancudo-fort-zancudo.png`;
      if (categoryId === 'vzm') return `image/ВЗМ-vzm.png`;
      return `image/${locationName}.png`;
    };

    const CALLOUTS_LOCATIONS = ['Церковь', 'Завод', 'Миррор', 'Палето', 'Тату', 'Особняк', 'Рокфорд', 'Муравейник', 'Сендик', 'Пирс', 'Стройка', 'Ветряки', 'Ферма', 'Порт'];
    const AIRDROP_LOCATIONS = ['Порт', 'ВЗМ', 'Завод', 'Нефть', 'Самолёты', 'Киностудия', 'Апельсин', 'Ветряки', 'Стройка', 'Подъёмник', 'Петля', 'Альтруисты', 'Меды', 'Юнион', 'Буквы', 'Обсерватория', 'ВЗХ', 'Церковь'];

    const MAP_CATEGORIES = [
      { id: 'callouts', name: 'Карты обозначений', groups: [{ title: 'КАРТЫ', items: CALLOUTS_LOCATIONS.map((name, i) => ({ id: `callouts-${i}`, code: `CL-${i + 1 < 10 ? '0' + (i + 1) : i + 1}`, name, rootPng: getRootPngFilename('callouts', name), tacticSummary: `Стандартный тактический разбор сектора "${name}". Контроль ключевых позиций состава HAZE.` })) }] },
      { id: 'mcl', name: 'Карты MCL', groups: [
        { title: 'MCL', items: ['Ghetto', 'Industrial Area', 'Vinewood', 'Sandy Shores', 'Farm', 'City', 'Mirror'].map((name, i) => ({ id: `mcl-${i}`, code: `MCL-${i + 1 < 10 ? '0' + (i + 1) : i + 1}`, name, rootPng: getRootPngFilename('mcl', name), tacticSummary: `Турнирная карта MCL "${name}". Расстановка ролей и удержание позиций.` })) },
        { title: 'ВОЙНА ЗА ЗОНЫ', items: ['Windmill', 'Redwood'].map((name, i) => ({ id: `vzm-zone-${i}`, code: `WZ-${i + 1}`, name, rootPng: getRootPngFilename('mcl', name), tacticSummary: `Война за зоны на объекте "${name}". Сбор семьи и перехват инициативы.` })) }
      ]},
      { id: 'airdrop', name: 'Аирдроп', groups: [{ title: 'КАРТЫ', items: AIRDROP_LOCATIONS.map((name, i) => ({ id: `airdrop-${i}`, code: `AD-${i + 1 < 10 ? '0' + (i + 1) : i + 1}`, name, rootPng: getRootPngFilename('airdrop', name), tacticSummary: `Точки сброса и споты на аирдропе "${name}". Оборона периметра.` })) }] },
      { id: 'dealers', name: 'Цеха\\Дилеры', groups: [{ title: 'ОБЪЕКТ', items: [{ id: 'dealers-0', code: 'DL-01', name: 'Цеха \\ Дилеры', rootPng: getRootPngFilename('dealers', 'Цеха \\ Дилеры'), tacticSummary: 'Основная карта цехов и дилерских точек для контроля производства.' }] }] },
      { id: 'zancudo', name: 'Форт Занкудо', groups: [{ title: 'ОБЪЕКТ', items: [{ id: 'zancudo-0', code: 'FZ-01', name: 'Форт Занкудо', rootPng: getRootPngFilename('zancudo', 'Форт Занкудо'), tacticSummary: 'Основная схема военного объекта Форт Занкудо для штурма и обороны.' }] }] },
      { id: 'vzm', name: 'ВЗМ', groups: [{ title: 'ОБЪЕКТ', items: [{ id: 'vzm-0', code: 'VZM-01', name: 'ВЗМ', rootPng: getRootPngFilename('vzm', 'ВЗМ'), tacticSummary: 'Основная тактическая карта для Войны за материалы (ВЗМ).' }] }] }
    ];

    function CategoryIcon({ id, active }) {
      const cls = `w-4 h-4 transition-all duration-300 ${active ? 'text-white scale-110 drop-shadow-[0_0_8px_rgba(255,255,255,0.7)]' : 'text-zinc-500 group-hover:text-zinc-300'}`;
      return <svg className={cls} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={1.8}><circle cx="12" cy="12" r="9" /></svg>;
    }

    function TacticalMapCanvas({ location }) {
      const canvasRef = useRef(null);
      const [tool, setTool] = useState('pan');
      const [strokeColor, setStrokeColor] = useState('#ef4444');
      const [lineWidth, setLineWidth] = useState(8);
      const [markerLabel, setMarkerLabel] = useState('1');
      const [customText, setCustomText] = useState('HAZE');
      const [history, setHistory] = useState([]);
      const [isDrawing, setIsDrawing] = useState(false);
      const [startPos, setStartPos] = useState({ x: 0, y: 0 });
      const [currentPoints, setCurrentPoints] = useState([]);
      
      const [scale, setScale] = useState(1);
      const [pan, setPan] = useState({ x: 0, y: 0 });
      const [isPanning, setIsPanning] = useState(false);
      const [panStart, setPanStart] = useState({ x: 0, y: 0 });
      const [loadedImg, setLoadedImg] = useState(null);

      useEffect(() => {
        const saved = localStorage.getItem(`haze_tactic_${location.id}`);
        if (saved) { try { setHistory(JSON.parse(saved)); } catch { setHistory([]); } } else { setHistory([]); }
        setScale(1);
        setPan({ x: 0, y: 0 });
      }, [location.id]);

      useEffect(() => {
        try { localStorage.setItem(`haze_tactic_${location.id}`, JSON.stringify(history)); } catch {}
      }, [history, location.id]);

      useEffect(() => {
        if (!location.rootPng) { setLoadedImg(null); return; }
        const img = new Image();
        img.onload = () => setLoadedImg(img);
        img.onerror = () => setLoadedImg(null);
        img.src = location.rootPng;
      }, [location.rootPng]);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const W = loadedImg ? loadedImg.naturalWidth || 1600 : 1600;
        const H = loadedImg ? loadedImg.naturalHeight || 1200 : 1200;
        if (canvas.width !== W) canvas.width = W;
        if (canvas.height !== H) canvas.height = H;

        ctx.clearRect(0, 0, W, H);
        if (loadedImg) {
          ctx.drawImage(loadedImg, 0, 0, W, H);
          ctx.fillStyle = 'rgba(6, 11, 25, 0.45)';
          ctx.fillRect(0, 0, W, H);
        } else {
          ctx.fillStyle = '#09090b';
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = 'rgba(255,255,255,0.08)';
          ctx.font = '700 36px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(`HAZE // ${location.name.toUpperCase()}`, W / 2, H / 2 - 20);
          ctx.font = '500 16px monospace';
          ctx.fillStyle = 'rgba(255,255,255,0.5)';
          ctx.fillText(`Файл не найден: ${location.rootPng}`, W / 2, H / 2 + 20);
        }

        history.forEach((el) => {
          ctx.save();
          ctx.strokeStyle = el.color;
          ctx.fillStyle = el.color;
          ctx.lineWidth = el.width || 8;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          if (el.type === 'pen' && el.points.length > 1) {
            ctx.beginPath();
            ctx.moveTo(el.points[0].x, el.points[0].y);
            el.points.forEach((p) => ctx.lineTo(p.x, p.y));
            ctx.stroke();
          } else if (el.type === 'arrow') {
            const dx = el.end.x - el.start.x;
            const dy = el.end.y - el.start.y;
            const angle = Math.atan2(dy, dx);
            ctx.beginPath(); ctx.moveTo(el.start.x, el.start.y); ctx.lineTo(el.end.x, el.end.y); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(el.end.x, el.end.y);
            ctx.lineTo(el.end.x - 24 * Math.cos(angle - Math.PI / 6), el.end.y - 24 * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(el.end.x - 24 * Math.cos(angle + Math.PI / 6), el.end.y - 24 * Math.sin(angle + Math.PI / 6));
            ctx.closePath(); ctx.fill();
          } else if (el.type === 'circle') {
            const rx = Math.hypot(el.end.x - el.start.x, el.end.y - el.start.y);
            ctx.beginPath(); ctx.arc(el.start.x, el.start.y, rx, 0, Math.PI * 2);
            ctx.fillStyle = `${el.color}33`; ctx.fill(); ctx.stroke();
          } else if (el.type === 'marker') {
            ctx.beginPath(); ctx.arc(el.pos.x, el.pos.y, 24, 0, Math.PI * 2);
            ctx.fillStyle = '#000000'; ctx.fill(); ctx.lineWidth = 4; ctx.strokeStyle = el.color; ctx.stroke();
            ctx.fillStyle = '#ffffff'; ctx.font = '700 18px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(el.label || '1', el.pos.x, el.pos.y);
          } else if (el.type === 'text') {
            ctx.font = '700 20px monospace';
            const metrics = ctx.measureText(el.text);
            ctx.fillStyle = 'rgba(0,0,0,0.85)'; ctx.fillRect(el.pos.x - 8, el.pos.y - 18, metrics.width + 16, 30);
            ctx.strokeStyle = el.color; ctx.strokeRect(el.pos.x - 8, el.pos.y - 18, metrics.width + 16, 30);
            ctx.fillStyle = '#ffffff'; ctx.textAlign = 'left'; ctx.fillText(el.text, el.pos.x, el.pos.y + 2);
          }
          ctx.restore();
        });

        if (isDrawing && tool === 'pen' && currentPoints.length > 1) {
          ctx.save(); ctx.strokeStyle = strokeColor; ctx.lineWidth = lineWidth;
          ctx.beginPath(); ctx.moveTo(currentPoints[0].x, currentPoints[0].y);
          currentPoints.forEach((p) => ctx.lineTo(p.x, p.y));
          ctx.stroke(); ctx.restore();
        }
      }, [history, isDrawing, currentPoints, location, strokeColor, lineWidth, tool, loadedImg]);

      const getPoint = (e) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const clientX = e.clientX - rect.left;
        const clientY = e.clientY - rect.top;
        return {
          x: (clientX / rect.width) * canvas.width,
          y: (clientY / rect.height) * canvas.height,
        };
      };

      const handleWheel = (e) => {
        e.preventDefault();
        const zoomIntensity = 0.15;
        let newScale = scale + (e.deltaY < 0 ? zoomIntensity : -zoomIntensity);
        newScale = Math.max(1, Math.min(4, newScale));
        setScale(newScale);
        if (newScale === 1) setPan({ x: 0, y: 0 });
      };

      const handleMouseDown = (e) => {
        if (tool === 'pan' || e.shiftKey || e.button === 1) {
          setIsPanning(true);
          setPanStart({ x: e.clientX - pan.x, y: e.clientY - pan.y });
          return;
        }

        const pt = getPoint(e);
        if (tool === 'marker') { setHistory(prev => [...prev, { type: 'marker', pos: pt, color: strokeColor, label: markerLabel }]); return; }
        if (tool === 'text') { if (!customText.trim()) return; setHistory(prev => [...prev, { type: 'text', pos: pt, color: strokeColor, text: customText.trim() }]); return; }
        
        setIsDrawing(true);
        setStartPos(pt);
        setCurrentPoints([pt]);
      };

      const handleMouseMove = (e) => {
        if (isPanning) {
          setPan({ x: e.clientX - panStart.x, y: e.clientY - panStart.y });
          return;
        }
        if (!isDrawing) return;
        const pt = getPoint(e);
        if (tool === 'pen') setCurrentPoints(prev => [...prev, pt]);
      };

      const handleMouseUp = (e) => {
        if (isPanning) { setIsPanning(false); return; }
        if (!isDrawing) return;
        const endPt = getPoint(e);
        setIsDrawing(false);
        if (tool === 'pen' && currentPoints.length > 1) {
          setHistory(prev => [...prev, { type: 'pen', color: strokeColor, width: lineWidth, points: currentPoints }]);
        } else if (tool === 'arrow') {
          setHistory(prev => [...prev, { type: 'arrow', color: strokeColor, width: lineWidth, start: startPos, end: endPt }]);
        } else if (tool === 'circle') {
          setHistory(prev => [...prev, { type: 'circle', color: strokeColor, width: lineWidth, start: startPos, end: endPt }]);
        }
        setCurrentPoints([]);
      };

      const handleDownload = () => {
        const canvas = canvasRef.current; if (!canvas) return;
        const link = document.createElement('a'); link.download = `HAZE_${location.name}.png`;
        link.href = canvas.toDataURL('image/png'); link.click();
      };

      return (
        <div className="space-y-3">
          <div className="flex flex-wrap items-center justify-between gap-3 p-3 rounded-2xl bg-zinc-900/90 border border-white/10 backdrop-blur-md">
            <div className="flex items-center gap-1">
              {[
                { id: 'pan', label: '✋ Лапка' },
                { id: 'pen', label: 'Кисть' }, 
                { id: 'arrow', label: 'Стрелка' }, 
                { id: 'circle', label: 'Зона' },
                { id: 'marker', label: 'Метка' }, 
                { id: 'text', label: 'Текст' }
              ].map((t) => (
                <button key={t.id} onClick={() => setTool(t.id)} className={`px-3 py-1.5 rounded-xl text-xs font-mono uppercase tracking-wider transition-all duration-200 ${tool === t.id ? 'bg-white text-black font-bold shadow-[0_0_15px_rgba(255,255,255,0.4)]' : 'bg-black/40 text-zinc-400 hover:text-white'}`}>{t.label}</button>
              ))}
            </div>

            <div className="flex items-center gap-2">
              {tool === 'marker' && (
                <div className="flex items-center gap-1">
                  {['1', '2', '3', 'S', 'P', 'C'].map((lbl) => (
                    <button key={lbl} onClick={() => setMarkerLabel(lbl)} className={`w-6 h-6 rounded text-xs font-bold transition ${markerLabel === lbl ? 'bg-white text-black' : 'bg-zinc-800 text-zinc-400'}`}>{lbl}</button>
                  ))}
                </div>
              )}
              {tool === 'text' && (
                <input type="text" value={customText} onChange={(e) => setCustomText(e.target.value)} className="px-2.5 py-1 rounded-xl text-xs bg-black border border-white/20 text-white" />
              )}
              
              {tool === 'pen' && (
                <div className="flex items-center gap-1 bg-black/50 px-2 py-1 rounded-xl border border-white/10">
                  <span className="text-[10px] font-mono text-zinc-400">Толщина:</span>
                  {[6, 12, 20, 32].map((w) => (
                    <button key={w} onClick={() => setLineWidth(w)} className={`px-2 py-0.5 rounded text-xs font-mono ${lineWidth === w ? 'bg-white text-black font-bold' : 'text-zinc-400 hover:text-white'}`}>{w}</button>
                  ))}
                </div>
              )}

              <div className="flex items-center gap-1 px-2 py-1 rounded-xl bg-black/50 border border-white/10">
                {['#ef4444', '#ffffff', '#38bdf8', '#facc15', '#22c55e'].map((c) => (
                  <button key={c} onClick={() => setStrokeColor(c)} className={`w-5 h-5 rounded-full border transition-transform ${strokeColor === c ? 'border-white scale-125 shadow-lg' : 'border-transparent opacity-70'}`} style={{ backgroundColor: c }} />
                ))}
              </div>
              
              <div className="flex items-center gap-1 bg-black/60 px-2 py-1 rounded-xl border border-white/10 font-mono text-xs">
                <button onClick={() => { setScale(s => Math.max(1, s - 0.5)); if(scale <= 1.5) setPan({x:0, y:0}); }} className="px-2 text-zinc-300 hover:text-white">-</button>
                <span className="text-amber-400 font-bold">{Math.round(scale * 100)}%</span>
                <button onClick={() => setScale(s => Math.min(4, s + 0.5))} className="px-2 text-zinc-300 hover:text-white">+</button>
              </div>

              <button onClick={() => setHistory(prev => prev.slice(0, -1))} className="px-3 py-1.5 rounded-xl text-xs font-mono bg-zinc-800 text-zinc-300 hover:text-white">Отмена</button>
              <button onClick={() => setHistory([])} className="px-3 py-1.5 rounded-xl text-xs font-mono bg-red-500/10 text-red-400 border border-red-500/20">Очистить</button>
              <button onClick={handleDownload} className="px-4 py-1.5 rounded-xl text-xs font-mono bg-white text-black font-bold hover:bg-zinc-200 transition">Скачать</button>
            </div>
          </div>

          <div className="rounded-3xl border border-white/25 bg-black overflow-hidden shadow-[0_30px_70px_rgba(0,0,0,0.9)] relative group select-none h-[620px] flex items-center justify-center">
            <div 
              className={`w-full h-full overflow-hidden relative flex items-center justify-center ${tool === 'pan' ? 'cursor-grab active:cursor-grabbing' : 'cursor-crosshair'}`}
              onWheel={handleWheel}
              onMouseDown={handleMouseDown}
              onMouseMove={handleMouseMove}
              onMouseUp={handleMouseUp}
              onContextMenu={(e) => e.preventDefault()}
            >
              <canvas
                ref={canvasRef}
                style={{
                  transform: `translate(${pan.x}px, ${pan.y}px) scale(${scale})`,
                  transformOrigin: 'center center',
                  transition: isPanning ? 'none' : 'transform 0.1s ease-out',
                  maxWidth: '100%',
                  maxHeight: '100%',
                  objectFit: 'contain'
                }}
                className="block"
              />

            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [selectedServer, setSelectedServer] = useState('Miami');
      const [activeCategoryId, setActiveCategoryId] = useState('callouts');
      const [activeLocationId, setActiveLocationId] = useState('callouts-0');
      const [copiedKey, setCopiedKey] = useState(null);
      const [introStep, setIntroStep] = useState(1);
      const [showLicenseModal, setShowLicenseModal] = useState(false);
      const [showDevModal, setShowDevModal] = useState(false);
      const [mousePos, setMousePos] = useState({ x: 0, y: 0 });

      useEffect(() => {
        const handleMove = (e) => setMousePos({ x: e.clientX, y: e.clientY });
        window.addEventListener('mousemove', handleMove);
        return () => window.removeEventListener('mousemove', handleMove);
      }, []);

      const copyText = (val, key) => {
        navigator.clipboard?.writeText(val);
        setCopiedKey(key);
        setTimeout(() => setCopiedKey(null), 2000);
      };

      const activeCategory = MAP_CATEGORIES.find(c => c.id === activeCategoryId) || MAP_CATEGORIES[0];
      const allLocs = activeCategory.groups.flatMap(g => g.items);
      const activeLoc = allLocs.find(l => l.id === activeLocationId) || allLocs[0];
      const displayedServers = selectedServer === 'All' ? ['Miami', 'Memphis'] : [selectedServer];

      return (
        <div className="min-h-screen bg-[#030305] text-zinc-100 font-sans relative overflow-x-hidden">

          {/* Стартовый дисклеймер */}

            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/92 backdrop-blur-3xl animate-fade">
              <div className="max-w-xl w-full glass-card p-8 md:p-10 rounded-3xl space-y-6 border-white/25 shadow-[0_0_100px_rgba(0,0,0,0.9)]">
                <div className="flex items-center justify-between border-b border-white/10 pb-4">

                      <p>Данный веб-портал создан исключительно для участников криминального сообщества <strong>HAZE</strong> на проекте <strong>Majestic RP (Miami #8 & Memphis #19)</strong>.</p>
                      <p>Сайт <strong>не аффилирован и не связан</strong> с компаниями Rockstar Games, Take-Two Interactive или разработчиками GTA V.</p>
                      <p>Все материалы, логотипы и карты используются исключительно для внутренней координации семейных операций.</p>

                    <div className="flex flex-col gap-2 pt-2">
                      <button onClick={() => setIntroStep(2)} className="w-full py-4 rounded-2xl bg-white text-black font-display font-bold text-xs uppercase tracking-widest hover:bg-zinc-200 transition shadow-[0_0_30px_rgba(255,255,255,0.4)]">
                        ОЗНАКОМЛЕН, ДАЛЕЕ →
                      </button>
                      <button onClick={() => { setShowLicenseModal(true); }} className="text-center font-mono text-[11px] text-zinc-400 hover:text-white underline pt-1">

                      </button>
                    </div>
                  </div>

                    </p>

                      <div>Discord для связи: <strong className="text-cyan-400 font-bold">k_5504</strong></div>
                    </div>
                    <div className="flex flex-col gap-2 pt-2">

                        Открыть подробный раздел DEV

                    </div>
                  </div>

              </div>
            </div>

                  <h4 className="text-white font-bold uppercase">1. Статус закрытого портала семьи HAZE</h4>

                  <span>DEV</span>
                </button>

                <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-xl bg-white/10 font-mono text-xs text-white uppercase tracking-widest">

                <div className="space-y-4 max-w-3xl">

                  </p>
                </div>
                <div className="flex flex-wrap gap-4 pt-4">
                  <button onClick={() => setActiveTab('maps')} className="px-8 py-4 rounded-2xl bg-white text-black font-display font-bold text-xs uppercase tracking-widest hover:bg-zinc-200 transition shadow-[0_0_30px_rgba(255,255,255,0.4)]">Открыть карты и тактики →</button>
                  <button onClick={() => setActiveTab('roster')} className="px-8 py-4 rounded-2xl glass-card text-white font-mono text-xs uppercase tracking-widest hover:border-white/40 transition">Состав руководства</button>
                </div>
              </div>
            )}

            {activeTab === 'roster' && (
              <div className="space-y-10">
                <div className="flex flex-col md:flex-row md:items-end justify-between gap-6 border-b border-white/10 pb-6">
                  <div>
                    <div className="font-mono text-xs text-zinc-400 tracking-widest uppercase mb-1">УПРАВЛЕНИЕ СЕМЬЕЙ</div>
                    <h2 className="font-display text-3xl md:text-4xl font-black text-white">РУКОВОДСТВО СЕМЬИ</h2>
                  </div>
                  <div className="flex gap-2 p-1.5 glass-card rounded-2xl">
                    {['Miami', 'Memphis', 'All'].map(s => (
                      <button key={s} onClick={() => setSelectedServer(s)} className={`px-5 py-2.5 rounded-xl font-mono text-xs font-bold uppercase transition ${selectedServer === s ? 'bg-white text-black shadow-lg' : 'text-zinc-400 hover:text-white'}`}>{s === 'All' ? 'Все сервера' : s}</button>
                    ))}
                  </div>
                </div>

                <div className="space-y-12">
                  {displayedServers.map(srvKey => {
                    const roster = LEADERSHIP_DATA[srvKey];
                    return (
                      <div key={srvKey} className="space-y-6">
                        <div className="font-mono text-xs text-zinc-400 uppercase tracking-widest border-b border-white/10 pb-2">Крыло: {roster.serverTitle}</div>
                        <div className="glass-card p-6 md:p-8 rounded-3xl leader-card-glow bg-gradient-to-r from-amber-500/15 via-transparent to-transparent flex flex-col md:flex-row md:items-center justify-between gap-6">
                          <div className="space-y-1.5">
                            <span className="px-3.5 py-1 rounded-full bg-amber-400/20 border border-amber-400/60 text-amber-300 font-mono text-[10px] font-bold tracking-widest uppercase">ЛИДЕР СЕМЬИ</span>

                            <div className="font-mono text-xs text-zinc-400">Static ID: #{roster.leader.staticId}</div>

                          <button onClick={() => copyText(roster.leader.discord, `l-${srvKey}`)} className="px-6 py-3 rounded-xl bg-amber-400 text-black font-mono text-xs font-bold uppercase hover:bg-amber-300 transition">
                            {copiedKey === `l-${srvKey}` ? 'СКОПИРОВАНО ✓' : `ДС: ${roster.leader.discord}`}

                            const cardStyle = isDev ? 'dev-card-glow bg-cyan-950/20' : isColler ? 'coller-card-glow bg-red-950/20' : 'border-white/15';
